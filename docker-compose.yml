services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiftup
      POSTGRES_PASSWORD: shiftup_dev_password
      POSTGRES_DB: shiftup
    ports:
      - "5432:5432"
    volumes:
      - shiftup_pgdata:/var/lib/postgresql/data

volumes:
  shiftup_pgdata:
